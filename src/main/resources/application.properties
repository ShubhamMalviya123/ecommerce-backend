# ================= SERVER =================
server.port=9630

# ================= DATABASE (MySQL) =================
# Pehle MySQL me database bana lo:  CREATE DATABASE ecommerce_db;
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sonu@9630
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ================= JWT =================
# Secret kam se kam 32 characters ka hona chahiye
app.jwt.secret=ThisIsASuperSecretKeyForEcommerceApp123456789
app.jwt.expiration-ms=86400000

# ================= FILE UPLOAD (product images url only, no upload handling here) =================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

